<section class="modal-stage">
  <div class="proto-modal-form">
    <div class="proto-modal-head">
      <span>弹窗标题</span>
      <span>×</span>
    </div>
    <div class="proto-modal-body">
      <div class="proto-field-row">
        <div class="proto-field-label">字段1</div>
        <input class="proto-input" type="text" placeholder="请输入" />
      </div>
      <div class="proto-field-row">
        <div class="proto-field-label">字段2</div>
        <select class="proto-select">
          <option selected>请选择</option>
        </select>
      </div>
    </div>
    <div class="proto-modal-foot">
      <button class="btn btn-ghost" type="button">取消</button>
      <button class="btn btn-primary" type="button">确认</button>
    </div>
  </div>
</section>
