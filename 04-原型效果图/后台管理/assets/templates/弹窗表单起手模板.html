<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>弹窗表单起手模板</title>
  <link rel="stylesheet" href="../prototype.css" />
</head>
<body>
  <section class="proto-modal-form-stage">
    <div class="proto-modal-form">
      <div class="proto-modal-head">
        <span>弹窗标题</span>
        <span>×</span>
      </div>
      <div class="proto-modal-body">
        <div class="proto-modal-grid">
          <div class="proto-field-label">字段1</div>
          <input class="proto-input" type="text" placeholder="请输入" />

          <div class="proto-field-label">字段2</div>
          <select class="proto-select">
            <option selected>请选择</option>
          </select>

          <div class="proto-field-label">备注</div>
          <textarea class="proto-textarea" placeholder="请输入备注"></textarea>
        </div>
      </div>
      <div class="proto-modal-foot">
        <button class="btn btn-ghost" type="button">取消</button>
        <button class="btn btn-primary" type="button">确认</button>
      </div>
    </div>
  </section>
</body>
</html>
